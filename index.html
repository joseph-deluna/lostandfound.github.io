<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UC Online Lost and Found — a browser-only portfolio demo.">
  <title>UC Online Lost and Found</title>
  <link rel="icon" href="images/icon/logo-mini.png">
  <link rel="stylesheet" href="vendor/bootstrap-4.1/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/font-awesome-5/css/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="app/demo.css">
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="app"><p class="p-4" role="status">Loading your local workspace…</p></div>
  <noscript><p class="p-4">Enable JavaScript to use this browser-only demo.</p></noscript>
  <dialog id="confirmation" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Delete this record?</h2>
    <p id="confirm-text"></p>
    <form method="dialog" class="actions"><button class="btn btn-secondary" value="cancel" autofocus>Cancel</button><button class="btn btn-danger" value="delete">Delete record</button></form>
  </dialog>
</body>
</html>
